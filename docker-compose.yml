services:
  api:
    build: .
    image: ocr-eval-manifest-api
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/ocr_eval.db
    volumes:
      - ocr-eval-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  ocr-eval-data:
